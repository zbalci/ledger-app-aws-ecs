version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip

  build:
    commands:
      - echo "=== Packaging Lambda Function ==="
      - cd infrastructure/assets/lambda
      - zip function.zip lambda_function.py
      - cd -

      - echo "=== Building Lambda Layer ==="
      - mkdir -p layer_build/python/lib/python3.11/site-packages
      - pip install -r infrastructure/assets/lambda/requirements.txt -t layer_build/python/lib/python3.11/site-packages
      - cd layer_build
      - zip -r ../database-init-layer.zip python
      - cd -

  post_build:
    commands:
      - echo "=== Uploading Artifacts ==="
      - aws s3 cp infrastructure/assets/lambda/function.zip s3://$ASSET_BUCKET/lambda/function.zip

      - aws s3 cp database-init-layer.zip s3://$ASSET_BUCKET/lambda/database-init-layer.zip

artifacts:
  files:
    - infrastructure/assets/lambda/function.zip
    - database-init-layer.zip
