version: 0.2

env:
  variables:
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - ls -lh
      - pwd
      - cat infrastructure/assets/db-init/ecs/Dockerfile
  build:
    commands:
      - echo Build Docker image...
      - docker build infrastructure/assets/db-init/ecs/Dockerfile
      - docker tag $REPO_NAME:$IMAGE_TAGtest $ECR_URI:$BUILD_PURPOSE/$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing the Docker image to Amazon ECR...
      - docker push $ECR_URI:$IMAGE_TAG