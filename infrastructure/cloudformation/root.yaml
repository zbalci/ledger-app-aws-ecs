Parameters:
  AppName:
    Type: String
    Description: App name
    Default: ledger

  Environment:
    Type: String
    AllowedValues:
      - prod
      - dev
    Default: dev

  GithubConnectionArn:
    Type: String
    Description: Github Connection ARN
    Default: arn:aws:codeconnections:eu-north-1:253712034003:connection/2c02ecd9-b115-4cec-967f-a0e4445ecfaa
    NoEcho: True

  SourceRepo:
    Type: String
    Description: owner/repo biçiminde GitHub repo ID'si
    Default: zbalci/ledger-app-aws-ecs

  AppPort:
    Type: Number
    Default: 80

  # Available only in Prod Env with Blue/Green Deployment
  TestPort:
    Type: Number
    Default: 8080

  DBPort:
    Type: Number
    Description: Database port
    Default: 3306

Mappings:
  EnvConfig:
    dev:
      DeploymentType: rolling
      Branch: dev
      #AutoScalingGroup
      ASGMin: 1
      ASGMax: 2
      ASGDesired: 1
      #ECS Service
      ServiceDesired: 1

    prod:
      DeploymentType: bluegreen
      Branch: main
      #AutoScalingGroup
      ASGMin: 1
      ASGMax: 2
      ASGDesired: 1
      #ECS Service
      ServiceDesired: 1

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/network/vpc.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/security/securitygroups.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        AppPort: !Ref AppPort
        TestPort: !Ref TestPort
        DBPort: !Ref DBPort
  
  LoadbalanceStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/loadbalancer/alb.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !FindInMap [EnvConfig, !Ref Environment, DeploymentType]
        AppPort: !Ref AppPort
        TestPort: !Ref TestPort

  RegistryStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/registry/root.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - SecurityStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/database/rds.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DBPort: !Ref DBPort

  EcsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
      - LoadbalanceStack
      - RegistryStack
      - DatabaseStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/compute/ecs/root.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !FindInMap [EnvConfig, !Ref Environment, DeploymentType]
        AppPort: !Ref AppPort
        ServiceDesired: !FindInMap [EnvConfig, !Ref Environment, ServiceDesired]
        ASGMin: !FindInMap [EnvConfig, !Ref Environment, ASGMin]
        ASGMax: !FindInMap [EnvConfig, !Ref Environment, ASGMax]
        ASGDesired: !FindInMap [EnvConfig, !Ref Environment, ASGDesired]

  DatabaseInitStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - DatabaseStack
      - EcsStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/pipeline/db-init/root.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        GithubConnectionArn: !Ref GithubConnectionArn
        SourceRepo: !Ref SourceRepo
        SourceBranch: !FindInMap [EnvConfig, !Ref Environment, Branch]

  CodePipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - LoadbalanceStack
      - RegistryStack
      - EcsStack
      - DatabaseStack
      - DatabaseInitStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/pipeline/web/root.yaml
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !FindInMap [EnvConfig, !Ref Environment, DeploymentType]
        SourceRepo: !Ref SourceRepo
        SourceBranch: !FindInMap [EnvConfig, !Ref Environment, Branch]
        GithubConnectionArn: !Ref GithubConnectionArn
        AppPort: !Ref AppPort