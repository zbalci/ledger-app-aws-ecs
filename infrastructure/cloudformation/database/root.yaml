Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  CFNBucket:
    Type: String
    Description: S3 bucket name used for CFN template and deployment files
    Default: ledger-app-aws-iac

  LambdaLayerKey:
    Type: String
    Description: S3 bucket key used by lambda layer zip
    Default: db-init/lambda/db-init-layer.zip

  LambdaFunctionKey:
    Type: String
    Description: S3 bucket key used by lambda function zip
    Default: db-init/lambda/db-init-function.zip

  InitSqlKey:
    Type: String
    Description: S3 bucket key used by sql db init
    Default: db-init/sql/init.sql

  DBName:
    Type: String
    Description: Database Name
    Default: ledger

  DBUser:
    Type: String
    Description: Database User Name
    Default: ledger

  DBPort:
    Type: String
    Description: Database User Name
    Default: 3306

Resources:
  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/database/rds.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DBName: !Ref DBName
        DBUser: !Ref DBUser
        DBPort: !Ref DBPort

  RdsDbInit:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - RdsStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/database/db-init-runtime.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        CFNBucket: !Ref CFNBucket
        LambdaLayerKey: !Ref LambdaLayerKey
        LambdaFunctionKey: !Ref LambdaFunctionKey
        InitSqlKey: !Ref InitSqlKey