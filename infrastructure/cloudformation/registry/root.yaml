AWSTemplateFormatVersion: '2010-09-09'
Description: ECR Repository Stack Template

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

Resources:
  ECRImageCleanerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub '{{resolve:ssm:/${AppName}/${Environment}/iac_bucket_url}}/registry/shared/ecr-repository-cleanup.yaml'
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  ECRStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECRImageCleanerStack
    Properties:
      TemplateURL: !Sub '{{resolve:ssm:/${AppName}/${Environment}/iac_bucket_url}}/registry/web/repository.yaml'
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

