AWSTemplateFormatVersion: '2010-09-09'
Description: Trigger for first build

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

Resources:
  StartBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          PROJECT_NAME: !Sub "${AppName}-${Environment}-build"
      Code:
        ZipFile: |
          import os
          import json
          import urllib3
          import boto3
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          codebuild = boto3.client('codebuild')
          http = urllib3.PoolManager()
          
          def send_response(event, context, response_status, reason=None):
              response_url = event['ResponseURL']
          
              response_body = {
                  'Status': response_status,
                  'Reason': reason or f"See the details in CloudWatch Log Stream: {context.log_stream_name}",
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
          
              json_response_body = json.dumps(response_body)
              headers = {
                  'content-type': '',
                  'content-length': str(len(json_response_body))
              }
          
              try:
                  response = http.request(
                      'PUT',
                      response_url,
                      body=json_response_body,
                      headers=headers
                  )
                  logger.info(f"CFN response sent: {response.status}")
              except Exception as e:
                  logger.error(f"Failed to send CFN response: {str(e)}")
          
          def handler(event, context):
              request_type = event.get("RequestType")
              logger.info(f"Received request type: {request_type}")
          
              try:
                  if request_type == "Create":
                      logger.info("Triggering CodeBuild for Create event")
                      project_name = os.environ.get('PROJECT_NAME')
                      logger.info(f"Using project name: {project_name}")
                      codebuild.start_build(projectName=project_name)
                  else:
                      logger.info(f"Skipping CodeBuild for {request_type} event")
          
                  # Her durumda CloudFormation’a başarılı yanıt dön
                  send_response(event, context, "SUCCESS")
              except Exception as e:
                  logger.error(f"Error during custom resource handling: {str(e)}")
                  send_response(event, context, "FAILED", reason=str(e))

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildTrigger
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource: "*"

  StartBuildCustomResource:
    Type: Custom::TriggerBuild
    Properties:
      ServiceToken: !GetAtt StartBuildFunction.Arn