AWSTemplateFormatVersion: '2010-09-09'
Description: CodePipeline IAM Role with Conditional IAM Policies for ECS Deployment

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

Resources:
  ### BlueGreen Policy
  BlueGreenPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CodeDeployAndECSAccess
      Roles:
        Fn::ImportValue:
          Fn::Sub: ${AppName}-${Environment}-CodePipelineServiceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCodeDeployDeploymentActions
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetDeployment
            Resource:
              Fn::ImportValue:
                Fn::Sub: ${AppName}-${Environment}-CodeDeployDGArn

          - Sid: AllowCodeDeployApplicationActions
            Effect: Allow
            Action:
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:RegisterApplicationRevision
            Resource:
              - Fn::ImportValue:
                  Fn::Sub: ${AppName}-${Environment}-CodeDeployAppArn
              - Fn::Sub:
                  - "${AppArn}/*"
                  - AppArn:
                      Fn::ImportValue:
                        Fn::Sub: ${AppName}-${Environment}-CodeDeployAppArn

          - Sid: AllowCodeDeployDeploymentConfigAccess
            Effect: Allow
            Action:
              - codedeploy:GetDeploymentConfig
            Resource: "*"

          - Sid: AllowECSRegisterTaskDefinition
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
            Resource: "*"

          - Sid: AllowPassRoleToECS
            Effect: Allow
            Action: iam:PassRole
            Resource:
              Fn::ImportValue:
                Fn::Sub: ${AppName}-${Environment}-TaskExecutionRoleArn
            Condition:
              StringEquals:
                iam:PassedToService:
                  - ecs.amazonaws.com
                  - ecs-tasks.amazonaws.com