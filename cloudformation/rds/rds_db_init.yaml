Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  CFNBucket:
    Type: String
    Description: S3 bucket name used by CodePipeline

  LambdaKey:
    Type: String
    Description: S3 bucket key used by lambda function

  SqlKey:
    Type: String
    Description: S3 bucket key used by sql db init

Resources:
  DatabaseInitLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DatabaseInitAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CFNBucket}/${SqlKey}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: "*"

  DatabaseInitLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-db-init"
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt DatabaseInitLambdaRole.Arn
      Timeout: 300
      Code:
        S3Bucket: !Ref CFNBucket
        S3Key: !Ref LambdaKey
      Environment:
        Variables:
          DB_HOST: !Sub '{{resolve:ssm:/${AppName}/${Environment}/db/host}}'
          DB_USER: !Sub '{{resolve:ssm:/${AppName}/${Environment}/db/user}}'
          DB_NAME: !Sub '{{resolve:ssm:/${AppName}/${Environment}/db/database}}'
          DB_SECRET_NAME:
            Fn::ImportValue: !Sub "${AppName}-${Environment}-rds-master-secret-arn"
          SQL_BUCKET: !Ref CFNBucket
          SQL_KEY: !Ref SqlKey

  DatabaseInitTrigger:
    Type: Custom::DatabaseInitDatabase
    Properties:
      ServiceToken: !GetAtt DatabaseInitLambda.Arn