AWSTemplateFormatVersion: '2010-09-09'
Description: ECR Repository Template

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AppName}/${Environment}"
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 30 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
          
# 2. IAM Role for Lambda
  DeleteECRImagesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowECRDelete
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # 3. Lambda Function
  DeleteECRImagesFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Role: !GetAtt DeleteECRImagesRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib3

          def lambda_handler(event, context):
              print("Event:", json.dumps(event))

              if event["RequestType"] != "Delete":
                  return send_response(event, context, "SUCCESS", {})

              repo_name = event["ResourceProperties"]["RepositoryName"]
              account_id = event["ResourceProperties"]["AccountId"]
              ecr = boto3.client("ecr")

              try:
                  response = ecr.list_images(repositoryName=repo_name, registryId=account_id)
                  image_ids = response.get("imageIds", [])

                  if image_ids:
                      ecr.batch_delete_image(
                          repositoryName=repo_name,
                          registryId=account_id,
                          imageIds=image_ids
                      )
                      print(f"Deleted {len(image_ids)} images from {repo_name}")
              except Exception as e:
                  print("Error:", str(e))
                  return send_response(event, context, "FAILED", {"Error": str(e)})

              return send_response(event, context, "SUCCESS", {})

          def send_response(event, context, status, data):
              http = urllib3.PoolManager()
              response_body = {
                  "Status": status,
                  "Reason": f"See details in CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }
              json_response = json.dumps(response_body)
              headers = {"Content-Type": "application/json"}
              http.request("PUT", event["ResponseURL"], body=json_response, headers=headers)

  # 4. Custom Resource to Trigger Lambda on Delete
  ECRImageCleaner:
    Type: Custom::DeleteECRImages
    Properties:
      ServiceToken: !GetAtt DeleteECRImagesFunction.Arn
      RepositoryName: !Ref ECRRepository
      AccountId: !Ref AWS::AccountId
      
Outputs:
  RepositoryUri:
    Description: "ECR repository URI"
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub ${AppName}-${Environment}-ecr-uri