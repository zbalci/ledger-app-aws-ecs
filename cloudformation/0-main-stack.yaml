# main-stack.yaml
Parameters:
  AppName:
    Type: String
    Description: App name
    Default: ledger-app

  Environment:
    Type: String
    Description: Environment name
    AllowedValues:
      - prod
      - dev
    Default: prod

  DeploymentType:
    Type: String
    Description: Deployment tipi (bluegreen veya rolling)
    AllowedValues:
      - bluegreen
      - rolling
    Default: rolling

  GithubConnectionArn:
    Type: String
    Description: Github Connection ARN
    Default: arn:aws:codeconnections:eu-north-1:253712034003:connection/2c02ecd9-b115-4cec-967f-a0e4445ecfaa

  GitRepoId:
    Type: String
    Description: owner/repo biçiminde GitHub repo ID'si
    Default: zbalci/ledger-app-aws-ecs

  GitBranch:
    Type: String
    Default: main

  InstanceType:
    Type: String
    Description: EC2 instance tipi
    Default: t3.micro

  KeyName:
    Type: String
    Default: zekib
    Description: Key-pair

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: ECS-uyumlu AMI ID
    Default: ami-0f3092a09bb5324c4

  ContainerPort:
    Type: Number
    Default: 80

  ListenerPort:
    Type: Number
    Default: 80

  TestListenerPort:
    Type: Number
    Default: 8080

  ArtifactBucket:
    Type: String
    Description: S3 bucket name used by CodePipeline
    Default: ledger-app-artifacts-bucket

Conditions:
  IsRolling: !Equals [ !Ref DeploymentType, "rolling" ]
  IsBlueGreen: !Equals [ !Ref DeploymentType, "bluegreen" ]

Resources:
  ECR:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/1-ecr-repo.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/2-vpc.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  ALBStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/3-alb-conditional.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !Ref DeploymentType
        ContainerPort: !Ref ContainerPort
        ListenerPort: !Ref ListenerPort
        TestListenerPort: !Ref TestListenerPort

  ECSTask:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/5-0-ecs-task.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        ContainerPort: !Ref ContainerPort

  CodeBuild:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECR
      - ECSTask
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/5-1-code-build.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !Ref DeploymentType
        GitRepoId: !Ref GitRepoId
        GithubConnectionArn: !Ref GithubConnectionArn
        ArtifactBucket: !Ref ArtifactBucket
        ContainerPort: !Ref ContainerPort

  ECSCluster:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/5-2-ecs-cluster.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        AmiId: !Ref AmiId
        ContainerPort: !Ref ContainerPort

  ECSService:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSCluster
      - ALBStack
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/5-3-ecs-service.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !Ref DeploymentType
        ContainerPort: !Ref ContainerPort

  CodePipelineServiceRoleBase:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSService
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/7-1-codepipeline-service-role-base.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        ArtifactBucket: !Ref ArtifactBucket
        GithubConnectionArn: !Ref GithubConnectionArn

  CodePipelineServiceRoleRolling:
    Condition: IsRolling
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - CodePipelineServiceRoleBase
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/7-1-codepipeline-service-role-rolling.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  CodePipelineRolling:
    Type: AWS::CloudFormation::Stack
    Condition: IsRolling
    DependsOn:
      - CodePipelineServiceRoleRolling
      - ECSService
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/7-2-codepipeline.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !Ref DeploymentType
        GithubConnectionArn: !Ref GithubConnectionArn
        GitRepoId: !Ref GitRepoId
        GitBranch: !Ref GitBranch
        ArtifactBucket: !Ref ArtifactBucket
        ContainerPort: !Ref ContainerPort

  CodeDeploy:
    Condition: IsBlueGreen
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECSService
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/6-code-deploy-blue-green.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  CodePipelineServiceRoleBlueGreen:
    Condition: IsBlueGreen
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - CodePipelineServiceRoleBase
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/7-1-codepipeline-service-role-bluegreen.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  CodePipelineBlueGreen:
    Type: AWS::CloudFormation::Stack
    Condition: IsBlueGreen
    DependsOn:
      - CodePipelineServiceRoleBlueGreen
      - CodeDeploy
    Properties:
      TemplateURL: https://ledger-app-aws-iac.s3.eu-north-1.amazonaws.com/7-2-codepipeline.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        DeploymentType: !Ref DeploymentType
        GitRepoId: !Ref GitRepoId
        GitBranch: !Ref GitBranch
        ArtifactBucket: !Ref ArtifactBucket
        GithubConnectionArn: !Ref GithubConnectionArn
        ContainerPort: !Ref ContainerPort