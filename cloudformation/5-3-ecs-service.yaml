AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Service Template (Blue/Green & Rolling Update)

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  DeploymentType:
    Type: String
    Description: Deployment Type (BlueGreen or Rolling)

  ContainerPort:
    Type: Number

Conditions:
  IsBlueGreen: !Equals [ !Ref DeploymentType, BlueGreen ]
  IsRolling: !Equals [ !Ref DeploymentType, Rolling ]

Resources:

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${AppName}-${Environment}-service"
      Cluster:
        Fn::ImportValue:
          Fn::Sub: ${AppName}-${Environment}-ECSCluster
      TaskDefinition:
        Fn::ImportValue:
          Fn::Sub: ${AppName}-${Environment}-TaskDefinition
      DesiredCount: 0
      LaunchType: !If
        - IsRolling
        - !Ref "AWS::NoValue"
        - EC2

      DeploymentController: !If
        - IsBlueGreen
        - { Type: CODE_DEPLOY }
        - !Ref "AWS::NoValue"

      DeploymentConfiguration: !If
        - IsRolling
        - 
          MaximumPercent: 200
          MinimumHealthyPercent: 100
        - !Ref "AWS::NoValue"

      LoadBalancers:
        - ContainerName: !Sub "${AppName}-${Environment}"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !If
            - IsBlueGreen
            - Fn::ImportValue:
                Fn::Sub: ${AppName}-${Environment}-BlueTG
            - Fn::ImportValue:
                Fn::Sub: ${AppName}-${Environment}-RollingTG

      CapacityProviderStrategy: !If
        - IsRolling
        - 
          - CapacityProvider:
              Fn::ImportValue:
                Fn::Sub: ${AppName}-${Environment}--CapacityProvider
            Base: 0
            Weight: 1
        - !Ref "AWS::NoValue"
      DesiredCount: 1

Outputs:
  ECSService:
    Description: ECSService ***
    Value: !Ref ECSService
    Export:
      Name: !Sub ${AppName}-${Environment}-ECSService

  ECSServiceArn:
    Description: ECSService ARN ***
    Value: !GetAtt ECSService.ServiceArn
    Export:
      Name: !Sub ${AppName}-${Environment}-ECSServiceArn